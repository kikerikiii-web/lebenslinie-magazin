<div class="wp-block-group" style="max-width: 1340px; margin: 0 auto; display: grid; grid-template-columns: 1fr 340px; gap: 3rem;">

            <div class="open-flipbook-btn" style="position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.15); margin-bottom: 1.2rem;">
